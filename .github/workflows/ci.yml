name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-vet:
    name: Format, Vet & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt formatting
        run: |
          UNFORMATTED=$(gofmt -s -l cmd/ internal/ test/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Verify Dockerfile Go version is not lower than go.mod
        run: |
          GOMOD_VER=$(awk '/^go [0-9]+\.[0-9]+/ {print $2; exit}' go.mod)
          DOCKER_VER=$(awk -F'[: -]+' '/^FROM golang:[0-9]+\.[0-9]+/ {print $3; exit}' Dockerfile)
          if [ -z "$GOMOD_VER" ] || [ -z "$DOCKER_VER" ]; then
            echo "Failed to parse Go version from go.mod ($GOMOD_VER) or Dockerfile ($DOCKER_VER)" >&2
            exit 1
          fi
          awk -v gomod="$GOMOD_VER" -v docker="$DOCKER_VER" 'BEGIN {
            split(gomod, g, ".")
            split(docker, d, ".")
            g_maj = g[1] + 0; g_min = g[2] + 0; g_pat = (g[3] != "" ? g[3] + 0 : 0)
            d_maj = d[1] + 0; d_min = d[2] + 0; d_pat = (d[3] != "" ? d[3] + 0 : 0)
            # A floating tag such as golang:1.26 resolves to the newest 1.26.x, so it satisfies any go 1.26.N directive.
            if (d[3] == "" && d_maj == g_maj && d_min == g_min) {
              exit 0
            }
            if (d_maj < g_maj || (d_maj == g_maj && d_min < g_min) || (d_maj == g_maj && d_min == g_min && d_pat < g_pat)) {
              printf "Dockerfile Go version (%s) is lower than go.mod (%s)\n", docker, gomod > "/dev/stderr"
              exit 1
            }
          }'

      - name: Run go vet
        run: make vet

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test-and-race:
    name: Unit, Fuzz Corpus, Crash & Race Tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run test suite with race detector
        run: make race

      - name: Build binary
        run: make build

      - name: Verify CLI entrypoint
        run: ./bin/litebase --help

  docker-e2e:
    name: Docker Build & 3-Curl Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-vet, test-and-race]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t litebase:ci .

      - name: Start container and run 3-curl quickstart check
        env:
          LITEBASE_BOOTSTRAP_TOKEN: "lbk_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          docker run -d --name litebase-ci \
            -p 127.0.0.1:8080:8080 \
            -e LITEBASE_BOOTSTRAP_TOKEN="$LITEBASE_BOOTSTRAP_TOKEN" \
            litebase:ci \
            serve --addr 0.0.0.0:8080 --data-dir /var/lib/litebase

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz

          curl -fsS -X POST http://127.0.0.1:8080/v1/databases \
            -H "Authorization: Bearer $LITEBASE_BOOTSTRAP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"main","durability":"full"}'

          curl -fsS -X POST http://127.0.0.1:8080/v1/databases/main/batch \
            -H "Authorization: Bearer $LITEBASE_BOOTSTRAP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"statements":[
              {"sql":"CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"},
              {"sql":"INSERT INTO users (name) VALUES (?)","params":[{"type":"text","value":"Ada"}]}
            ]}'

          curl -fsS -X POST http://127.0.0.1:8080/v1/databases/main/query \
            -H "Authorization: Bearer $LITEBASE_BOOTSTRAP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"sql":"SELECT id, name FROM users"}'

          docker stop litebase-ci
          docker rm litebase-ci

  installer-test:
    name: ShellCheck & Installer Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on install scripts
        run: shellcheck install.sh scripts/test-install.sh

      - name: Run installer test suite (sh, dash, bash)
        run: sh scripts/test-install.sh


