name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          # GitHub retired macos-13 on 2025-12-04; macos-15-intel is on a retirement clock
          # (scheduled for retirement in Fall 2027 when GitHub phases out Intel x86_64 macOS runners).
          # Follow-up issue tracks building darwin/amd64 on macos-latest (arm64).
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser snapshot build (workflow_dispatch dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Build release archive
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.3-beta-snapshot"
          fi
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/ibrahimraimi/litebase/internal/config.Version=${VERSION} -X github.com/ibrahimraimi/litebase/internal/config.Commit=${COMMIT} -X github.com/ibrahimraimi/litebase/internal/config.BuildDate=${BUILD_DATE}"
          mkdir -p dist
          go build -trimpath -ldflags "${LDFLAGS}" -o dist/litebase ./cmd/litebase
          ./dist/litebase --version
          ./dist/litebase serve --help >/dev/null
          cp README.md CHANGELOG.md dist/
          ARCHIVE="litebase_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
          tar -C dist -czf "${ARCHIVE}" litebase README.md CHANGELOG.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: litebase_*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        working-directory: artifacts
        run: sha256sum litebase_*.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/litebase_*.tar.gz
            artifacts/checksums.txt

